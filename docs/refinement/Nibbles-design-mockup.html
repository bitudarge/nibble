document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ircles }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"10\" r=\"4.2\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"2.2\"><\u002Fcircle><circle cx=\"16\" cy=\"13\" r=\"3.4\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"2.2\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n        <sc-if value=\"{{ t.isYou }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8.5\" r=\"3.8\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"2.2\"><\u002Fcircle><path d=\"M5.5 20c1.2-3.6 3.6-5.4 6.5-5.4s5.3 1.8 6.5 5.4\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n        <div style=\"font:800 10.5px Nunito,sans-serif;color:{{ t.color }}\">{{ t.label }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(58,50,42,.42);display:flex;align-items:flex-end\">\n      <div style=\"width:100%;background:var(--card);border-radius:32px 32px 0 0;padding:22px 22px 28px;box-sizing:border-box;animation:nib-sheet .28s cubic-bezier(.2,.8,.2,1) both\">\n        <div style=\"width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px\"><\u002Fdiv>\n        <div style=\"font:600 21px/1.2 Lora,Georgia,serif;margin-bottom:4px\">{{ sheetTitle }}<\u002Fdiv>\n        <div style=\"font:400 13.5px Nunito,sans-serif;color:var(--muted);margin-bottom:18px\">Slide to where your bookmark is.<\u002Fdiv>\n        <div style=\"text-align:center;font:800 40px/1 Nunito,sans-serif;color:var(--sage);margin-bottom:4px\">{{ sheetPage }}<\u002Fdiv>\n        <div style=\"text-align:center;font:600 13px Nunito,sans-serif;color:var(--muted);margin-bottom:16px\">{{ sheetOf }}<\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"{{ sheetMax }}\" value=\"{{ sheetVal }}\" sc-camel-on-change=\"{{ onSheetVal }}\" aria-label=\"Current page\" style=\"width:100%;accent-color:var(--sage);height:34px\">\n        <div style=\"display:flex;gap:11px;margin-top:12px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onSheetClose }}\" style=\"flex:1;height:50px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:800 15px Nunito,sans-serif;cursor:pointer;transition:transform .14s ease\" style-active=\"transform:scale(.97)\">Cancel<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onSheetSave }}\" style=\"flex:2;height:50px;border:none;border-radius:999px;background:var(--sage);color:#FFFCF4;font:800 15px Nunito,sans-serif;box-shadow:0 3px 0 var(--sage-d);cursor:pointer;transition:transform .14s ease,box-shadow .14s ease\" style-active=\"transform:translateY(3px);box-shadow:0 0 0 var(--sage-d)\">{{ sheetCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ celebrating }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;overflow:hidden\">\n      <sc-for list=\"{{ leaves }}\" as=\"l\" hint-placeholder-count=\"10\">\n        <div style=\"position:absolute;top:-24px;left:{{ l.left }}%;width:12px;height:16px;border-radius:12px 2px 12px 2px;background:{{ l.color }};animation:nib-fall 1.5s ease-in {{ l.delay }}s both\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:20px;right:20px;bottom:104px;background:var(--sage-d);color:#FFFCF4;border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(58,50,42,.3);animation:nib-toast 2.6s ease both\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 96 96\" style=\"flex:none\" aria-hidden=\"true\"><circle cx=\"48\" cy=\"48\" r=\"34\" fill=\"#FFFCF4\"><\u002Fcircle><path d=\"M30 66 C26 44 44 32 60 38\" fill=\"none\" stroke=\"var(--sage)\" stroke-width=\"13\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"62\" cy=\"40\" r=\"12\" fill=\"var(--sage)\"><\u002Fcircle><path d=\"M56 38 Q59 35 62 38\" fill=\"none\" stroke=\"#FFFCF4\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"68\" cy=\"37\" r=\"2.2\" fill=\"#FFFCF4\"><\u002Fcircle><\u002Fsvg>\n      <div style=\"font:700 14px/1.4 Nunito,sans-serif\">{{ toast }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:920}}\">\nconst CATALOG = [\n  {id:'piranesi',title:'Piranesi',author:'Susanna Clarke',pages:245,avg:4.4,count:1280,tags:['dreamlike','slow burn','literary'],why:'Because you loved The Night Circus',whys:['You rated The Night Circus 5★ — same dreamlike drift','Your top tag this year is “quiet”','Short enough to finish before Sunday']},\n  {id:'lattes',title:'Legends & Lattes',author:'Travis Baldree',pages:304,avg:4.6,count:2140,tags:['cosy','found family','low stakes'],why:'The cosiest thing on your circle’s shelf',whys:['Three people in Sunday Sofa gave it 5★','Matches your “cosy” + “low stakes” streak','No cliffhangers — good for bedtime']},\n  {id:'circe',title:'Circe',author:'Madeline Miller',pages:393,avg:4.5,count:3310,tags:['myth','lyrical','slow burn'],why:'You rated Song of Achilles 5★',whys:['Same author, and you rated her last book 5★','You finish lyrical retellings 2× faster than average']},\n  {id:'nettle',title:'Nettle & Bone',author:'T. Kingfisher',pages:243,avg:4.2,count:870,tags:['quest','wry','gentle horror'],why:'Short — and your goal needs one more',whys:['243 pages: about four evenings at your pace','Wry and gentle, like the last three you loved']},\n  {id:'spinning',title:'Spinning Silver',author:'Naomi Novik',pages:466,avg:4.3,count:1590,tags:['winter','fairy tale','slow burn'],why:'Sunday Sofa is reading it now',whys:['Your circle is 40% through it right now','Fairy-tale retellings are your most-finished shelf']},\n  {id:'remains',title:'The Remains of the Day',author:'Kazuo Ishiguro',pages:258,avg:4.1,count:2010,tags:['quiet','melancholy','literary'],why:'Your top tag this year is “quiet”',whys:['Quiet + melancholy is your most-rated pairing']},\n  {id:'circus',title:'The Night Circus',author:'Erin Morgenstern',pages:512,avg:4.3,count:2600,tags:['whimsical','atmospheric'],why:'Readers like you kept it on a shelf for years',whys:['Similar readers rate it 4.5★','Atmospheric, and you read those slowly on purpose']}\n];\n\nconst REVIEWS = {\n  piranesi:{\n    circle:[{id:'c1',who:'Ada',meta:'in Sunday Sofa · 5★',body:'I read the last thirty pages standing up in my kitchen. The house is the whole point — let it be strange for a while.',spoiler:false},\n      {id:'c2',who:'Bo',meta:'in Sunday Sofa · 4★',body:'The moment the Other’s name lands, everything before it rearranges itself. I had to start again from page one.',spoiler:true}],\n    public:[{id:'p1',who:'reads_slowly',stars:'5★',body:'A book about being kind to yourself in an enormous, echoing place. I have thought about the tides every week since.',spoiler:false},\n      {id:'p2',who:'marginalia',stars:'4★',body:'The reveal about 16 changes what the journals were doing the whole time.',spoiler:true}]\n  }\n};\n\nconst DEFAULT_REVIEWS = {\n  circle:[{id:'g1',who:'Cy',meta:'in Night Owls · 4★',body:'Read this one slowly. It rewards the second week more than the first.',spoiler:false}],\n  public:[{id:'gp1',who:'tea_and_pages',stars:'4★',body:'Comfortable and generous. I would hand this to anyone coming out of a reading slump.',spoiler:false}]\n};\n\nclass Component extends DCLogic {\n  state = {\n    theme:'light', tab:'home', view:null, stack:[],\n    shelf:{piranesi:{status:'reading',page:148}, lattes:{status:'reading',page:60}, circe:{status:'want'}, spinning:{status:'reading',page:104}, remains:{status:'finished'}, circus:{status:'finished'}},\n    ratings:{remains:5, circus:5, piranesi:4},\n    query:'', shelfTab:'reading', peeked:{}, journal:'',\n    streak:6, finished:11, goal:24,\n    newName:'', joinCode:'', draft:'',\n    messages:[{id:'m1',who:'Ada',body:'Chapter 12 undid me. Anyone else at the mill yet?'},{id:'m2',who:'You',body:'Two chapters behind — no spoilers till Thursday!'},{id:'m3',who:'Bo',body:'Making tea and reading ahead. Deeply sorry.'}],\n    toast:null, celebrating:false, sheet:null\n  };\n\n  book(id){ return CATALOG.find(b => b.id === id) || CATALOG[0]; }\n\n  go(view){ this.setState(s => ({view, stack:[...s.stack, {tab:s.tab, view:s.view}]})); }\n  back(){ this.setState(s => { const st=[...s.stack]; const prev=st.pop(); return prev ? {stack:st, view:prev.view, tab:prev.tab} : {view:null}; }); }\n  tab(t){ this.setState({tab:t, view:null, stack:[]}); }\n\n  say(msg){\n    clearTimeout(this._t);\n    this.setState({toast:msg});\n    this._t = setTimeout(() => this.setState({toast:null}), 2500);\n  }\n\n  party(msg){\n    this.setState({celebrating:true});\n    this.say(msg);\n    clearTimeout(this._c);\n    this._c = setTimeout(() => this.setState({celebrating:false}), 1900);\n  }\n\n  setStatus(id, status){\n    const b = this.book(id);\n    this.setState(s => {\n      const cur = s.shelf[id] || {};\n      const next = {...s.shelf, [id]:{...cur, status, page: status==='finished' ? b.pages : (cur.page ?? 0)}};\n      return {shelf:next, finished: status==='finished' && cur.status!=='finished' ? s.finished+1 : s.finished};\n    });\n    if (status === 'finished') this.party('Finished — that’s ' + (this.state.finished + 1) + ' this year. Nibbles is proud.');\n    else if (status === 'reading') this.say('Tucked into your Reading shelf.');\n    else this.say('Saved for later on Want to read.');\n  }\n\n  cycle(id){\n    const order = ['want','reading','finished'];\n    const cur = (this.state.shelf[id] || {}).status || 'want';\n    this.setStatus(id, order[(order.indexOf(cur) + 1) % 3]);\n  }\n\n  rate(id, stars){\n    this.setState(s => ({ratings:{...s.ratings, [id]:stars}}));\n    this.say(stars >= 4 ? 'Noted — more like this coming your way.' : 'Thanks, that sharpens your recommendations.');\n  }\n\n  openSheet(id){\n    const b = this.book(id);\n    this.setState(s => ({sheet:{id, val:(s.shelf[id] || {}).page ?? 0, max:b.pages}}));\n  }\n\n  saveSheet(){\n    const sheet = this.state.sheet;\n    if (!sheet) return;\n    const b = this.book(sheet.id);\n    const done = sheet.val >= b.pages;\n    this.setState(s => ({\n      sheet:null,\n      shelf:{...s.shelf, [sheet.id]:{status: done ? 'finished' : 'reading', page:sheet.val}},\n      finished: done ? s.finished + 1 : s.finished,\n      streak: s.streak + 1\n    }));\n    if (done) this.party('You finished ' + b.title + '! A leaf for your trouble.');\n    else this.say('Page ' + sheet.val + ' saved — ' + (this.state.streak + 1) + ' day streak.');\n  }\n\n  pill(active, label, onClick){\n    return {label, onClick, style:'flex:1;height:40px;border:none;border-radius:999px;cursor:pointer;font:800 12.5px Nunito,sans-serif;transition:transform .14s ease,background .18s ease;' +\n      (active ? 'background:var(--sage);color:#FFFCF4;box-shadow:0 2px 6px var(--shadow);' : 'background:transparent;color:var(--muted);')};\n  }\n\n  renderVals(){\n    const s = this.state;\n    const view = s.view;\n    const shelfOf = id => (s.shelf[id] || {}).status || null;\n    const pageOf = id => (s.shelf[id] || {}).page ?? 0;\n    const pctOf = id => Math.min(100, Math.round((pageOf(id) / this.book(id).pages) * 100));\n\n    const reading = CATALOG.filter(b => shelfOf(b.id) === 'reading').map(b => ({\n      id:b.id, title:b.title, author:b.author, pct:pctOf(b.id),\n      pageLabel:'page ' + pageOf(b.id) + ' of ' + b.pages + ' · ' + pctOf(b.id) + '%',\n      onOpen:() => this.go('book:' + b.id), onUpdate:() => this.openSheet(b.id)\n    }));\n\n    const q = s.query.trim().toLowerCase();\n    const results = CATALOG.filter(b => !q || (b.title + ' ' + b.author + ' ' + b.tags.join(' ')).toLowerCase().includes(q))\n      .map(b => ({id:b.id, title:b.title, author:b.author, avgLabel:'★ ' + b.avg.toFixed(1) + ' · ' + b.count.toLocaleString() + ' ratings', onOpen:() => this.go('book:' + b.id)}));\n\n    const shelfKey = s.shelfTab;\n    const shelfBooks = CATALOG.filter(b => shelfOf(b.id) === shelfKey).map(b => ({\n      id:b.id, title:b.title, author:b.author, onOpen:() => this.go('book:' + b.id),\n      onMove:() => this.cycle(b.id),\n      moveLabel: shelfKey === 'want' ? 'Start reading →' : shelfKey === 'reading' ? 'Mark finished →' : 'Back to want to read'\n    }));\n\n    const bookId = view && view.startsWith('book:') ? view.slice(5) : null;\n    const b = bookId ? this.book(bookId) : null;\n    const rv = bookId ? (REVIEWS[bookId] || DEFAULT_REVIEWS) : DEFAULT_REVIEWS;\n    const mkReviews = list => list.map(r => ({\n      ...r, initial:r.who.charAt(0).toUpperCase(),\n      hidden: r.spoiler && !s.peeked[r.id], shown: !r.spoiler || !!s.peeked[r.id],\n      onPeek:() => this.setState(st => ({peeked:{...st.peeked, [r.id]:true}}))\n    }));\n\n    const myStars = bookId ? (s.ratings[bookId] || 0) : 0;\n\n    const members = [{name:'Ada',dot:'var(--sage)'},{name:'Bo',dot:'var(--sage)'},{name:'Cy',dot:'var(--line)'},{name:'Dee',dot:'var(--line)'},{name:'You',dot:'var(--sage)'}]\n      .map(m => ({...m, initial:m.name.charAt(0)}));\n\n    return {\n      theme:s.theme, isLight:s.theme==='light', isDark:s.theme==='dark',\n      onToggleTheme:() => this.setState(st => ({theme: st.theme === 'light' ? 'dark' : 'light'})),\n      themeLabel: s.theme === 'light' ? 'Switch to nighttime reading' : 'Back to daytime reading',\n      canBack: s.stack.length > 0 || !!view, onBack:() => this.back(),\n      isHome: !view && s.tab==='home', isDiscover: !view && s.tab==='discover', isShelves: !view && s.tab==='shelves',\n      isCircles: !view && s.tab==='circles', isYou: !view && s.tab==='you',\n      isBook: !!bookId, isRecs: view==='recs', isCircle: view==='circle',\n\n      streak:s.streak, goalLabel:s.finished + '/' + s.goal, goalPct:Math.min(100, Math.round((s.finished/s.goal)*100)),\n      streakDots:[0,1,2,3,4,5,6].map(i => ({bg: i < Math.min(7, s.streak) ? 'var(--honey-t)' : 'rgba(138,94,27,.22)'})),\n      reading,\n      recs:CATALOG.filter(x => !shelfOf(x.id)).slice(0,4).map(x => ({id:x.id, title:x.title, author:x.author, why:x.why, onOpen:() => this.go('book:' + x.id)})),\n      onRecs:() => this.go('recs'),\n      activity:[\n        {id:'a1',who:'Ada',circle:'Sunday Sofa',body:'“Chapter 12 undid me.”',initial:'A'},\n        {id:'a2',who:'Cy',circle:'Night Owls',body:'finished Circe — 5★',initial:'C'},\n        {id:'a3',who:'Dee',circle:'Sunday Sofa',body:'started Spinning Silver',initial:'D'}\n      ],\n\n      query:s.query, onQuery:e => this.setState({query:e.target.value}),\n      suggestions:['cosy','slow burn','quiet','fairy tale'].map(t => ({label:t, onClick:() => this.setState({query:t})})),\n      results, noResults:results.length === 0,\n      resultsLabel: q ? results.length + ' books for “' + s.query.trim() + '”' : 'Popular in your circles',\n\n      shelfPills:[\n        this.pill(s.shelfTab==='want','Want to read',() => this.setState({shelfTab:'want'})),\n        this.pill(s.shelfTab==='reading','Reading',() => this.setState({shelfTab:'reading'})),\n        this.pill(s.shelfTab==='finished','Finished',() => this.setState({shelfTab:'finished'}))\n      ],\n      shelfBooks, shelfEmpty:shelfBooks.length === 0, onDiscover:() => this.tab('discover'),\n\n      circleCards:[\n        {id:'sofa',name:'Sunday Sofa',memberLine:'4 friends · Ada, Bo, Cy, Dee',readTitle:'Spinning Silver',pct:40,pctLabel:'circle average 40%',avatars:[{initial:'A'},{initial:'B'},{initial:'C'},{initial:'D'}],onOpen:() => this.go('circle')},\n        {id:'owls',name:'Night Owls',memberLine:'2 friends · Cy, Fen',readTitle:'Piranesi',pct:72,pctLabel:'circle average 72%',avatars:[{initial:'C'},{initial:'F'}],onOpen:() => this.go('circle')}\n      ],\n      newName:s.newName, onNewName:e => this.setState({newName:e.target.value}),\n      onCreate:() => { if (s.newName.trim()) { this.setState({newName:''}); this.say('“' + s.newName.trim() + '” is ready — share the code.'); } },\n      joinCode:s.joinCode, onJoinCode:e => this.setState({joinCode:e.target.value.toUpperCase()}),\n      onJoin:() => { if (s.joinCode.trim()) { this.setState({joinCode:''}); this.say('You’re in. Say hello.'); } },\n\n      circleName:'Sunday Sofa', circleCode:'SOFA-24', circleMembers:members,\n      readTitle:'Spinning Silver', readTarget:'Target finish · 21 September',\n      readRows:[{name:'Ada',pct:64,pctLabel:'64%',fill:'var(--sage)'},{name:'Bo',pct:41,pctLabel:'41%',fill:'var(--sage)'},{name:'You',pct:pctOf('spinning'),pctLabel:pctOf('spinning') + '%',fill:'var(--honey)'},{name:'Dee',pct:12,pctLabel:'12%',fill:'var(--sage)'}],\n      messages:s.messages.map(m => ({...m, initial:m.who.charAt(0), dir: m.who === 'You' ? 'row-reverse' : 'row',\n        bg: m.who === 'You' ? 'var(--sage)' : 'var(--card)', fg: m.who === 'You' ? '#FFFCF4' : 'var(--ink)',\n        radius: m.who === 'You' ? '20px 20px 6px 20px' : '20px 20px 20px 6px'})),\n      draft:s.draft, onDraft:e => this.setState({draft:e.target.value}),\n      onPost:() => { const t = s.draft.trim(); if (!t) return; this.setState(st => ({draft:'', messages:[...st.messages, {id:'m' + Date.now(), who:'You', body:t}]})); },\n      showcase:['remains','circus','circe'].map(id => ({id, title:this.book(id).title, who:'Ada', onOpen:() => this.go('book:' + id)})),\n\n      bookTitle:b ? b.title : '', bookAuthor:b ? b.author : '',\n      bookAvg:b ? '★ ' + b.avg.toFixed(1) + ' average · ' + b.count.toLocaleString() + ' ratings' : '',\n      bookTags:b ? b.tags.map(t => ({label:t})) : [],\n      bookStars:[1,2,3,4,5].map(n => ({fill: n <= myStars ? 'var(--honey)' : 'var(--line)', aria:n + ' stars', onClick:() => this.rate(bookId, n)})),\n      bookShelfPills:[\n        this.pill(shelfOf(bookId)==='want','Want to read',() => this.setStatus(bookId,'want')),\n        this.pill(shelfOf(bookId)==='reading','Reading',() => this.setStatus(bookId,'reading')),\n        this.pill(shelfOf(bookId)==='finished','Finished',() => this.setStatus(bookId,'finished'))\n      ],\n      bookReading: bookId ? shelfOf(bookId) === 'reading' : false,\n      bookPct: bookId ? pctOf(bookId) : 0,\n      bookPctLabel: bookId ? pctOf(bookId) + '%' : '',\n      bookPageLabel: bookId && b ? 'page ' + pageOf(bookId) + ' of ' + b.pages : '',\n      onUpdateBook:() => this.openSheet(bookId),\n      journal:s.journal, onJournal:e => this.setState({journal:e.target.value}),\n      circleReviews:mkReviews(rv.circle), publicReviews:mkReviews(rv.public),\n\n      recList:CATALOG.filter(x => shelfOf(x.id) !== 'finished').slice(0,5).map(x => ({\n        id:x.id, title:x.title, author:x.author, whys:x.whys.map(t => ({text:t})),\n        onOpen:() => this.go('book:' + x.id),\n        wantLabel: shelfOf(x.id) === 'want' ? 'On your want-to-read ✓' : 'Add to want to read',\n        onWant:() => this.setStatus(x.id, 'want')\n      })),\n\n      wrapBooks:s.finished, wrapPages:'3,412',\n      topTags:['quiet (9)','slow burn (7)','cosy (6)','literary (5)'].map(t => ({label:t})),\n      favorites:['remains','circus','circe'].map(id => ({id, title:this.book(id).title, stars:'★ ' + ((s.ratings[id] || 5).toFixed(1)), onOpen:() => this.go('book:' + id)})),\n\n      tabs:[\n        {key:'home',label:'Home'},{key:'discover',label:'Discover'},{key:'shelves',label:'Shelves'},{key:'circles',label:'Circles'},{key:'you',label:'You'}\n      ].map(t => {\n        const active = !view && s.tab === t.key;\n        return {label:t.label, color: active ? 'var(--onleaf)' : 'var(--muted)',\n          isHome:t.key==='home', isDiscover:t.key==='discover', isShelves:t.key==='shelves', isCircles:t.key==='circles', isYou:t.key==='you',\n          onClick:() => this.tab(t.key),\n          style:'flex:1;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:19px;min-height:48px;transition:background .18s ease,transform .14s ease;background:' + (active ? 'var(--leaf)' : 'transparent')};\n      }),\n\n      sheetOpen:!!s.sheet, sheetTitle:s.sheet ? 'Where are you in ' + this.book(s.sheet.id).title + '?' : '',\n      sheetVal:s.sheet ? s.sheet.val : 0, sheetMax:s.sheet ? s.sheet.max : 100,\n      sheetPage:s.sheet ? s.sheet.val : 0, sheetOf:s.sheet ? 'of ' + s.sheet.max + ' pages · ' + Math.round((s.sheet.val / s.sheet.max) * 100) + '%' : '',\n      sheetCta:s.sheet && s.sheet.val >= s.sheet.max ? 'Finish the book' : 'Save progress',\n      onSheetVal:e => { const v = Number(e.target.value); this.setState(st => ({sheet:{...st.sheet, val:v}})); },\n      onSheetClose:() => this.setState({sheet:null}), onSheetSave:() => this.saveSheet(),\n\n      celebrating:s.celebrating,\n      leaves:[3,12,21,30,39,48,57,66,75,84,92].map((left,i) => ({left, delay:(i % 5) * 0.12, color: i % 3 === 0 ? 'var(--honey)' : i % 3 === 1 ? 'var(--sage)' : '#A9C6A4'})),\n      toast:s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
