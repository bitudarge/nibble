name: CI

# Runs on every pull request. Nothing here deploys or merges anything —
# it only reports pass/fail status checks for the owner to review before
# merging by hand. Branch protection (set up manually, see PR description)
# requires these checks to pass before a PR can be merged.
on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
